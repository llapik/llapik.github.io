<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>llapik — sprite reel</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  html, body { margin:0; padding:0; height:100%; background:#0a0a0a; overflow:hidden; }
  #root { position:fixed; inset:0; }
</style>

<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const Easing = {
  linear: (t) => t,
  easeInQuad:    (t) => t * t,
  easeOutQuad:   (t) => t * (2 - t),
  easeInOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
  easeInCubic:    (t) => t * t * t,
  easeOutCubic:   (t) => (--t) * t * t + 1,
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1),
  easeInQuart:    (t) => t * t * t * t,
  easeOutQuart:   (t) => 1 - (--t) * t * t * t,
  easeInOutQuart: (t) => (t < 0.5 ? 8 * t * t * t * t : 1 - 8 * (--t) * t * t * t),
  easeInExpo:  (t) => (t === 0 ? 0 : Math.pow(2, 10 * (t - 1))),
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutExpo: (t) => {
    if (t === 0) return 0; if (t === 1) return 1;
    if (t < 0.5) return 0.5 * Math.pow(2, 20 * t - 10);
    return 1 - 0.5 * Math.pow(2, -20 * t + 10);
  },
  easeInSine:    (t) => 1 - Math.cos((t * Math.PI) / 2),
  easeOutSine:   (t) => Math.sin((t * Math.PI) / 2),
  easeInOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
  easeOutBack: (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t-1,3) + c1 * Math.pow(t-1,2); },
  easeInBack:  (t) => { const c1 = 1.70158, c3 = c1 + 1; return c3*t*t*t - c1*t*t; },
  easeInOutBack: (t) => {
    const c1 = 1.70158, c2 = c1 * 1.525;
    return t < 0.5 ? (Math.pow(2*t,2)*((c2+1)*2*t-c2))/2 : (Math.pow(2*t-2,2)*((c2+1)*(t*2-2)+c2)+2)/2;
  },
  easeOutElastic: (t) => {
    const c4 = (2*Math.PI)/3;
    if (t===0) return 0; if (t===1) return 1;
    return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*c4)+1;
  },
};

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

function interpolate(input, output, ease = Easing.linear) {
  return (t) => {
    if (t <= input[0]) return output[0];
    if (t >= input[input.length-1]) return output[output.length-1];
    for (let i = 0; i < input.length-1; i++) {
      if (t >= input[i] && t <= input[i+1]) {
        const span = input[i+1] - input[i];
        const local = span === 0 ? 0 : (t - input[i]) / span;
        const easeFn = Array.isArray(ease) ? (ease[i] || Easing.linear) : ease;
        return output[i] + (output[i+1] - output[i]) * easeFn(local);
      }
    }
    return output[output.length-1];
  };
}

const TimelineContext = React.createContext({ time: 0, duration: 10, playing: false });
const useTime = () => React.useContext(TimelineContext).time;
const useTimeline = () => React.useContext(TimelineContext);
const SpriteContext = React.createContext({ localTime: 0, progress: 0, duration: 0 });
const useSprite = () => React.useContext(SpriteContext);

function Sprite({ start = 0, end = Infinity, children, keepMounted = false }) {
  const { time } = useTimeline();
  const visible = time >= start && time <= end;
  if (!visible && !keepMounted) return null;
  const duration = end - start;
  const localTime = Math.max(0, time - start);
  const progress = duration > 0 && isFinite(duration) ? clamp(localTime / duration, 0, 1) : 0;
  const value = { localTime, progress, duration, visible };
  return (
    <SpriteContext.Provider value={value}>
      {typeof children === 'function' ? children(value) : children}
    </SpriteContext.Provider>
  );
}

function IconButton({ children, onClick, title }) {
  const [hover, setHover] = React.useState(false);
  return (
    <button onClick={onClick} title={title}
      onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}
      style={{
        width:28, height:28, display:'flex', alignItems:'center', justifyContent:'center',
        background: hover ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)',
        border:'1px solid rgba(255,255,255,0.1)', borderRadius:6,
        color:'#f6f4ef', cursor:'pointer', padding:0, transition:'background 120ms',
      }}>
      {children}
    </button>
  );
}

function PlaybackBar({ time, duration, playing, onPlayPause, onReset, onSeek, onHover }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const timeFromEvent = React.useCallback((e) => {
    const rect = trackRef.current.getBoundingClientRect();
    return clamp((e.clientX - rect.left) / rect.width, 0, 1) * duration;
  }, [duration]);
  const onTrackMove = (e) => {
    if (!trackRef.current) return;
    dragging ? onSeek(timeFromEvent(e)) : onHover(timeFromEvent(e));
  };
  const onTrackDown = (e) => { setDragging(true); onSeek(timeFromEvent(e)); onHover(null); };
  React.useEffect(() => {
    if (!dragging) return;
    const onUp = () => setDragging(false);
    const onMove = (e) => { if (trackRef.current) onSeek(timeFromEvent(e)); };
    window.addEventListener('mouseup', onUp);
    window.addEventListener('mousemove', onMove);
    return () => { window.removeEventListener('mouseup', onUp); window.removeEventListener('mousemove', onMove); };
  }, [dragging, timeFromEvent, onSeek]);
  const pct = duration > 0 ? (time / duration) * 100 : 0;
  const fmt = (t) => {
    const total = Math.max(0, t);
    const m = Math.floor(total/60), s = Math.floor(total%60), cs = Math.floor((total*100)%100);
    return `${m}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
  };
  const mono = 'JetBrains Mono, ui-monospace, monospace';
  return (
    <div style={{
      display:'flex', alignItems:'center', gap:12, padding:'8px 16px',
      background:'rgba(20,20,20,0.92)', borderTop:'1px solid rgba(255,255,255,0.08)',
      width:'100%', maxWidth:680, alignSelf:'center', borderRadius:8, color:'#f6f4ef',
      fontFamily:'Inter, system-ui, sans-serif', userSelect:'none', flexShrink:0,
    }}>
      <IconButton onClick={onReset} title="Return to start (0)">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 2v10M12 2L5 7l7 5V2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round"/>
        </svg>
      </IconButton>
      <IconButton onClick={onPlayPause} title="Play/pause (space)">
        {playing
          ? <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/></svg>
          : <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 2l9 5-9 5V2z" fill="currentColor"/></svg>
        }
      </IconButton>
      <div style={{ fontFamily:mono, fontSize:12, fontVariantNumeric:'tabular-nums', width:64, textAlign:'right', color:'#f6f4ef' }}>{fmt(time)}</div>
      <div ref={trackRef} onMouseMove={onTrackMove} onMouseLeave={() => { if (!dragging) onHover(null); }} onMouseDown={onTrackDown}
        style={{ flex:1, height:22, position:'relative', cursor:'pointer', display:'flex', alignItems:'center' }}>
        <div style={{ position:'absolute', left:0, right:0, height:4, background:'rgba(255,255,255,0.12)', borderRadius:2 }}/>
        <div style={{ position:'absolute', left:0, width:`${pct}%`, height:4, background:'oklch(72% 0.12 250)', borderRadius:2 }}/>
        <div style={{ position:'absolute', left:`${pct}%`, top:'50%', width:12, height:12, marginLeft:-6, marginTop:-6, background:'#fff', borderRadius:6, boxShadow:'0 2px 4px rgba(0,0,0,0.4)' }}/>
      </div>
      <div style={{ fontFamily:mono, fontSize:12, fontVariantNumeric:'tabular-nums', width:64, textAlign:'left', color:'rgba(246,244,239,0.55)' }}>{fmt(duration)}</div>
    </div>
  );
}

function Stage({ width=1920, height=1080, duration=10, background='#f6f4ef', loop=true, autoplay=true, persistKey='animstage', children }) {
  const [time, setTime] = React.useState(() => {
    try { const v = parseFloat(localStorage.getItem(persistKey+':t')||'0'); return isFinite(v) ? clamp(v,0,duration) : 0; } catch { return 0; }
  });
  const [playing, setPlaying] = React.useState(autoplay);
  const [hoverTime, setHoverTime] = React.useState(null);
  const [scale, setScale] = React.useState(1);
  const stageRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const lastTsRef = React.useRef(null);

  React.useEffect(() => { try { localStorage.setItem(persistKey+':t', String(time)); } catch {} }, [time, persistKey]);

  React.useEffect(() => {
    if (!stageRef.current) return;
    const el = stageRef.current;
    const measure = () => {
      const s = Math.min(el.clientWidth/width, (el.clientHeight-44)/height);
      setScale(Math.max(0.05, s));
    };
    measure();
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    window.addEventListener('resize', measure);
    return () => { ro.disconnect(); window.removeEventListener('resize', measure); };
  }, [width, height]);

  React.useEffect(() => {
    if (!playing) { lastTsRef.current = null; return; }
    const step = (ts) => {
      if (lastTsRef.current == null) lastTsRef.current = ts;
      const dt = (ts - lastTsRef.current) / 1000;
      lastTsRef.current = ts;
      setTime((t) => {
        let next = t + dt;
        if (next >= duration) { if (loop) next = next % duration; else { next = duration; setPlaying(false); } }
        return next;
      });
      rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); lastTsRef.current = null; };
  }, [playing, duration, loop]);

  React.useEffect(() => {
    const onKey = (e) => {
      if (e.target?.tagName === 'INPUT' || e.target?.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') { e.preventDefault(); setPlaying(p => !p); }
      else if (e.code === 'ArrowLeft') setTime(t => clamp(t-(e.shiftKey?1:0.1), 0, duration));
      else if (e.code === 'ArrowRight') setTime(t => clamp(t+(e.shiftKey?1:0.1), 0, duration));
      else if (e.key === '0' || e.code === 'Home') setTime(0);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [duration]);

  const displayTime = hoverTime != null ? hoverTime : time;
  const ctxValue = React.useMemo(() => ({ time:displayTime, duration, playing, setTime, setPlaying }), [displayTime, duration, playing]);

  return (
    <div ref={stageRef} style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', background:'#0a0a0a' }}>
      <div style={{ flex:1, width:'100%', display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden', minHeight:0 }}>
        <div style={{ width, height, background, position:'relative', transform:`scale(${scale})`, transformOrigin:'center', flexShrink:0, boxShadow:'0 20px 60px rgba(0,0,0,0.4)', overflow:'hidden' }}>
          <TimelineContext.Provider value={ctxValue}>{children}</TimelineContext.Provider>
        </div>
      </div>
      <PlaybackBar time={displayTime} duration={duration} playing={playing}
        onPlayPause={() => setPlaying(p => !p)} onReset={() => setTime(0)}
        onSeek={t => setTime(t)} onHover={t => setHoverTime(t)} />
    </div>
  );
}

// ── Scene constants ───────────────────────────────────────────────────────
const HEL = 'Helvetica Neue, Helvetica, Arial, sans-serif';
const MONO = 'JetBrains Mono, ui-monospace, monospace';
const FG = '#0a0a0a';
const BG = '#ededea';
const DIM = '#8a8a86';

function Grain() {
  return <div style={{ position:'absolute', inset:0, pointerEvents:'none', opacity:0.06, mixBlendMode:'multiply',
    backgroundImage:`url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")` }} />;
}

function StarField({ count=60 }) {
  const stars = React.useMemo(() => {
    const arr = []; let seed = 1337;
    const rnd = () => { seed = (seed*9301+49297)%233280; return seed/233280; };
    for (let i = 0; i < count; i++) arr.push({ x:rnd()*1920, y:rnd()*1080, r:rnd()*1.6+0.4, o:rnd()*0.5+0.15 });
    return arr;
  }, [count]);
  const t = useTime();
  return (
    <svg width="1920" height="1080" style={{ position:'absolute', inset:0, pointerEvents:'none' }}>
      {stars.map((s,i) => <circle key={i} cx={s.x} cy={s.y} r={s.r} fill={FG} opacity={s.o*(0.6+0.4*Math.sin(t*2+i*0.7))} />)}
    </svg>
  );
}

function Circle({ cx, cy, r, fill=FG, stroke=null, strokeW=1, opacity=1, dashed=false }) {
  return (
    <svg width="1920" height="1080" style={{ position:'absolute', inset:0, pointerEvents:'none' }}>
      <circle cx={cx} cy={cy} r={r} fill={fill} stroke={stroke||'none'} strokeWidth={strokeW} strokeDasharray={dashed?'4 6':'none'} opacity={opacity} />
    </svg>
  );
}

function HUD() {
  const t = useTime();
  const { duration } = useTimeline();
  const fmt = (v) => { const m=Math.floor(v/60),s=Math.floor(v%60),cs=Math.floor((v*100)%100); return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}:${String(cs).padStart(2,'0')}`; };
  return (
    <>
      <div style={{ position:'absolute', top:36, left:48, fontFamily:MONO, fontSize:13, color:FG, letterSpacing:'0.06em', textTransform:'uppercase' }}>llapik / portfolio reel</div>
      <div style={{ position:'absolute', top:36, right:48, fontFamily:MONO, fontSize:13, color:FG, letterSpacing:'0.06em', fontVariantNumeric:'tabular-nums' }}>T+{fmt(t)} / {fmt(duration)}</div>
      <div style={{ position:'absolute', bottom:36, left:48, fontFamily:MONO, fontSize:11, color:DIM, letterSpacing:'0.08em', textTransform:'uppercase' }}>2026 — alexandr stih</div>
      <div style={{ position:'absolute', bottom:36, right:48, fontFamily:MONO, fontSize:11, color:DIM, letterSpacing:'0.08em', textTransform:'uppercase' }}>sprite reel ▸ helvetica monochrome</div>
    </>
  );
}

function Reticle() {
  return (
    <svg width="1920" height="1080" style={{ position:'absolute', inset:0, pointerEvents:'none', opacity:0.18 }}>
      <line x1="960" y1="0" x2="960" y2="1080" stroke={FG} strokeWidth="0.5" strokeDasharray="2 8" />
      <line x1="0" y1="540" x2="1920" y2="540" stroke={FG} strokeWidth="0.5" strokeDasharray="2 8" />
    </svg>
  );
}

// ── Scene 1 — Intro (0–4s) ────────────────────────────────────────────────
function SceneIntro() {
  const { progress, localTime } = useSprite();
  const radius = interpolate([0,0.4,1],[0,180,220],Easing.easeOutCubic)(progress);
  const num = Math.floor(interpolate([0,0.7,1],[0,1,1],Easing.easeOutQuad)(progress)*999);
  return (
    <>
      <Circle cx={960} cy={540} r={radius} fill={FG} />
      {localTime > 0.2 && (
        <div style={{ position:'absolute', left:48, top:532, fontFamily:MONO, fontSize:12, color:FG, letterSpacing:'0.12em', textTransform:'uppercase', opacity:clamp((localTime-0.2)/0.5,0,1) }}>▸ booting reel</div>
      )}
      <div style={{ position:'absolute', right:48, bottom:120, fontFamily:HEL, fontSize:240, fontWeight:700, color:FG, letterSpacing:'-0.06em', lineHeight:0.85, fontVariantNumeric:'tabular-nums' }}>{String(num).padStart(3,'0')}</div>
      <div style={{ position:'absolute', right:48, bottom:80, fontFamily:MONO, fontSize:12, color:DIM, letterSpacing:'0.12em', textTransform:'uppercase' }}>scene 01 / 06</div>
    </>
  );
}

// ── Scene 2 — Name (4–9s) ─────────────────────────────────────────────────
function SceneName() {
  const { progress, localTime } = useSprite();
  const orbitT = localTime * 0.7;
  const sunX = 960, sunY = 540;
  const sunR = interpolate([0,0.3],[220,80],Easing.easeInOutCubic)(progress);
  const moonX = sunX + 320*Math.cos(orbitT*2*Math.PI);
  const moonY = sunY + 320*0.35*Math.sin(orbitT*2*Math.PI);
  const farX = sunX + 600*Math.cos(-orbitT*2*Math.PI*0.4+1.2);
  const farY = sunY + 220*Math.sin(-orbitT*2*Math.PI*0.4+1.2);

  const renderText = (str, startIdx=0) => [...str].map((ch,i) => {
    const p = clamp((progress-(0.15+(startIdx+i)*0.04))/0.3,0,1);
    const e = Easing.easeOutCubic(p);
    return <span key={i} style={{ display:'inline-block', opacity:e, transform:`translateY(${(1-e)*30}px)`, color:FG }}>{ch===' '?' ':ch}</span>;
  });

  return (
    <>
      <svg width="1920" height="1080" style={{ position:'absolute', inset:0, opacity:0.18 }}>
        <ellipse cx={sunX} cy={sunY} rx={320} ry={320*0.35} fill="none" stroke={FG} strokeWidth="0.8" strokeDasharray="3 8" />
      </svg>
      <Circle cx={sunX} cy={sunY} r={sunR} fill={FG} />
      <Circle cx={moonX} cy={moonY} r={28} fill={FG} />
      <Circle cx={farX} cy={farY} r={14} fill={FG} opacity={0.6} />
      <div style={{ position:'absolute', left:120, top:200, fontFamily:MONO, fontSize:14, color:FG, letterSpacing:'0.18em', textTransform:'uppercase', opacity:clamp(progress*4,0,1) }}>▸ привет, я</div>
      <div style={{ position:'absolute', left:120, top:260, fontFamily:HEL, fontSize:220, fontWeight:800, color:FG, letterSpacing:'-0.05em', lineHeight:0.92 }}>{renderText('Alexandr')}</div>
      <div style={{ position:'absolute', left:120, top:470, fontFamily:HEL, fontSize:220, fontWeight:800, color:FG, letterSpacing:'-0.05em', lineHeight:0.92 }}>{renderText('Stih.',8)}</div>
      <div style={{ position:'absolute', left:124, top:720, fontFamily:HEL, fontSize:26, fontWeight:400, color:FG, letterSpacing:'-0.005em', maxWidth:880, opacity:clamp((progress-0.5)*4,0,1), transform:`translateY(${(1-clamp((progress-0.5)*4,0,1))*20}px)` }}>
        Создаю цифровые продукты на стыке дизайна,<br/>кода и безответственности.
      </div>
      <div style={{ position:'absolute', right:120, bottom:220, fontFamily:MONO, fontSize:12, color:FG, letterSpacing:'0.12em', textTransform:'uppercase', textAlign:'right', opacity:clamp((progress-0.4)*3,0,1) }}>
        body.01 — primary<br/>⌀ {Math.round(sunR*2)}px<br/>orbit ⟲ {orbitT.toFixed(2)}rad
      </div>
    </>
  );
}

// ── Scene 3 — About (9–14s) ───────────────────────────────────────────────
function SceneAbout() {
  const { progress, localTime } = useSprite();
  const bigX = interpolate([0,1],[-80,480],Easing.easeOutCubic)(progress);
  const bigR = interpolate([0,0.5,1],[340,360,380],Easing.easeInOutQuad)(progress);
  const smallX = interpolate([0,1],[1900,1380],Easing.easeOutCubic)(progress);
  const smallY = interpolate([0,1],[200,280],Easing.easeInOutQuad)(progress);

  const paragraph = `Developer & Creative Thinker.\n\nЯ разработчик с фокусом на визуальные\nвпечатления и интересные программные\nрешения. Каждая деталь продумана —\nот анимации до архитектуры кода.`;
  const revealChars = Math.floor(interpolate([0.15,0.95],[0,paragraph.length],Easing.linear)(progress));

  return (
    <>
      <Circle cx={bigX} cy={540} r={bigR} fill={FG} />
      <Circle cx={smallX} cy={smallY} r={90} fill="none" stroke={FG} strokeW={2} dashed />
      <Circle cx={smallX} cy={smallY} r={90*0.55} fill={FG} />
      <div style={{ position:'absolute', left:120, top:140, fontFamily:MONO, fontSize:12, color:FG, letterSpacing:'0.18em', textTransform:'uppercase', opacity:clamp(progress*5,0,1) }}>02 ▸ о себе / about</div>
      <div style={{ position:'absolute', left:720, top:220, fontFamily:HEL, fontSize:140, fontWeight:800, color:FG, letterSpacing:'-0.05em', lineHeight:0.9, opacity:clamp(progress*4,0,1), transform:`translateY(${(1-clamp(progress*4,0,1))*30}px)` }}>About<br/>the body.</div>
      <div style={{ position:'absolute', left:720, top:560, width:760, fontFamily:HEL, fontSize:26, fontWeight:400, color:FG, lineHeight:1.45, whiteSpace:'pre-wrap' }}>
        {paragraph.slice(0, revealChars)}
        <span style={{ display:'inline-block', width:12, height:28, background:FG, marginLeft:2, verticalAlign:'text-bottom', opacity:localTime%0.6<0.3?1:0 }} />
      </div>
      <div style={{ position:'absolute', left:120, bottom:140, fontFamily:MONO, fontSize:12, color:DIM, letterSpacing:'0.1em', textTransform:'uppercase' }}>readout · ⌀{Math.round(bigR*2)}px · drift {bigX>0?'+':''}{Math.round(bigX)}</div>
    </>
  );
}

// ── Scene 4 — Skills (14–20s) ─────────────────────────────────────────────
function SceneSkills() {
  const { progress } = useSprite();
  const skills = [
    { label:'JavaScript', x:380,  y:380, r:70 },
    { label:'C++',         x:760,  y:240, r:50 },
    { label:'C#',          x:1180, y:320, r:42 },
    { label:'Node.js',     x:1540, y:440, r:58 },
    { label:'CSS / SCSS',  x:1380, y:720, r:64 },
    { label:'Python',      x:940,  y:800, r:76 },
    { label:'WebGL',       x:540,  y:740, r:48 },
    { label:'UI / UX',     x:220,  y:600, r:36 },
  ];
  const arrival = (i) => clamp((progress-i*0.05)/0.45, 0, 1);
  const lineProgress = clamp((progress-0.45)/0.4, 0, 1);
  const seedOffset = (i) => { const a=(i*137.5)*Math.PI/180; return { dx:Math.cos(a)*1400, dy:Math.sin(a)*1000 }; };

  return (
    <>
      <div style={{ position:'absolute', left:120, top:140, fontFamily:MONO, fontSize:12, color:FG, letterSpacing:'0.18em', textTransform:'uppercase', opacity:clamp(progress*5,0,1) }}>03 ▸ stack / constellation</div>
      <div style={{ position:'absolute', left:120, top:200, fontFamily:HEL, fontSize:110, fontWeight:800, color:FG, letterSpacing:'-0.05em', lineHeight:0.95, opacity:clamp(progress*4,0,1) }}>the&nbsp;stack</div>
      <svg width="1920" height="1080" style={{ position:'absolute', inset:0 }}>
        {skills.map((s,i) => {
          if (i===0) return null;
          if (arrival(i-1)<0.9 || arrival(i)<0.9) return null;
          const prev = skills[i-1];
          const drawT = clamp(lineProgress*1.5-i*0.06, 0, 1);
          return <line key={i} x1={prev.x} y1={prev.y} x2={prev.x+(s.x-prev.x)*drawT} y2={prev.y+(s.y-prev.y)*drawT} stroke={FG} strokeWidth="1" strokeDasharray="3 6" opacity="0.5" />;
        })}
        {(() => {
          const drawT = clamp(lineProgress*1.4-0.6, 0, 1);
          if (drawT<=0) return null;
          const last=skills[skills.length-1], first=skills[0];
          return <line x1={last.x} y1={last.y} x2={last.x+(first.x-last.x)*drawT} y2={last.y+(first.y-last.y)*drawT} stroke={FG} strokeWidth="1" strokeDasharray="3 6" opacity="0.5" />;
        })()}
      </svg>
      {skills.map((s,i) => {
        const a = arrival(i);
        const ease = Easing.easeOutBack(a);
        const off = seedOffset(i);
        const x = s.x - off.dx*(1-ease);
        const y = s.y - off.dy*(1-ease);
        const labelOpacity = clamp((a-0.7)/0.3, 0, 1);
        return (
          <React.Fragment key={i}>
            <Circle cx={x} cy={y} r={s.r*Math.max(0.2,ease)} fill={FG} />
            <div style={{ position:'absolute', left:x+s.r+14, top:y-12, fontFamily:HEL, fontSize:22, fontWeight:500, color:FG, letterSpacing:'-0.005em', opacity:labelOpacity, transform:`translateX(${(1-labelOpacity)*-10}px)`, whiteSpace:'nowrap' }}>
              {s.label}
              <div style={{ fontFamily:MONO, fontSize:11, color:DIM, letterSpacing:'0.1em', marginTop:2 }}>⌀{Math.round(s.r*2)} · #{String(i+1).padStart(2,'0')}</div>
            </div>
          </React.Fragment>
        );
      })}
    </>
  );
}

// ── Scene 5 — Projects (20–27s) ───────────────────────────────────────────
function SceneProjects() {
  const { progress } = useSprite();
  const projects = [
    { idx:'01', title:'Genesis', desc:'WebGL particle field + shader playground', tag:'webgl · glsl', r:200, x:380, y:540 },
    { idx:'02', title:'Stellar', desc:'Three.js portfolio scene & camera rig',     tag:'three · gsap', r:160, x:960, y:540 },
    { idx:'03', title:'Atlas',   desc:'SCSS design system & motion tokens',         tag:'scss · ts',    r:120, x:1480, y:540 },
  ];
  const cardProg = (i) => clamp((progress-0.05-i*0.18)/0.45, 0, 1);

  return (
    <>
      <div style={{ position:'absolute', left:120, top:140, fontFamily:MONO, fontSize:12, color:FG, letterSpacing:'0.18em', textTransform:'uppercase', opacity:clamp(progress*5,0,1) }}>04 ▸ projects / catalogue</div>
      <div style={{ position:'absolute', left:120, top:200, fontFamily:HEL, fontSize:110, fontWeight:800, color:FG, letterSpacing:'-0.05em', lineHeight:0.95, opacity:clamp(progress*4,0,1) }}>the&nbsp;catalogue</div>
      {projects.map((p,i) => {
        const ease = Easing.easeOutCubic(cardProg(i));
        const r = p.r*Math.max(0.15,ease);
        const ringR = p.r+28;
        return (
          <React.Fragment key={i}>
            <svg width="1920" height="1080" style={{ position:'absolute', inset:0, pointerEvents:'none' }}>
              <circle cx={p.x} cy={p.y} r={ringR*Math.max(0.15,ease)} fill="none" stroke={FG} strokeWidth="1" strokeDasharray="3 6" opacity={ease*0.6} />
            </svg>
            <Circle cx={p.x} cy={p.y} r={r} fill={FG} />
            <div style={{ position:'absolute', left:p.x-60, top:p.y-32, width:120, textAlign:'center', fontFamily:HEL, fontSize:64, fontWeight:700, color:BG, letterSpacing:'-0.04em', lineHeight:1, opacity:ease }}>{p.idx}</div>
            <div style={{ position:'absolute', left:p.x-200, top:p.y+ringR+28, width:400, textAlign:'center', opacity:ease, transform:`translateY(${(1-ease)*16}px)` }}>
              <div style={{ fontFamily:HEL, fontSize:36, fontWeight:700, color:FG, letterSpacing:'-0.02em' }}>{p.title}</div>
              <div style={{ fontFamily:HEL, fontSize:16, fontWeight:400, color:FG, lineHeight:1.4, marginTop:8 }}>{p.desc}</div>
              <div style={{ fontFamily:MONO, fontSize:11, color:DIM, letterSpacing:'0.14em', textTransform:'uppercase', marginTop:14 }}>▸ {p.tag}</div>
            </div>
          </React.Fragment>
        );
      })}
    </>
  );
}

// ── Scene 6 — Contact (27–32s) ────────────────────────────────────────────
function SceneContact() {
  const { progress, localTime } = useSprite();
  const channels = [
    { label:'GitHub',   handle:'github.com/llapik', x:480 },
    { label:'Telegram', handle:'t.me/eayyyyyy',     x:960 },
    { label:'Email',    handle:'alex74s00@mail.ru', x:1440 },
  ];
  const eased = Easing.easeOutCubic(clamp(progress*2,0,1));
  const pulse = progress>0.65 ? 1+0.06*Math.sin((progress-0.65)*60) : 1;
  const finalWord = '▸ TRANSMIT';
  const showChars = Math.floor(clamp((progress-0.78)*4,0,1)*finalWord.length);

  return (
    <>
      <div style={{ position:'absolute', left:120, top:140, fontFamily:MONO, fontSize:12, color:FG, letterSpacing:'0.18em', textTransform:'uppercase', opacity:clamp(progress*5,0,1) }}>05 ▸ contact / signal</div>
      <div style={{ position:'absolute', left:0, top:220, width:1920, textAlign:'center', fontFamily:HEL, fontSize:280, fontWeight:800, color:FG, letterSpacing:'-0.06em', lineHeight:0.85, opacity:clamp((progress-0.55)*3,0,1)*0.08 }}>TRANSMIT</div>
      <div style={{ position:'absolute', left:120, top:220, fontFamily:HEL, fontSize:110, fontWeight:800, color:FG, letterSpacing:'-0.05em', lineHeight:0.95, opacity:clamp(progress*4,0,1) }}>open<br/>signal.</div>
      <div style={{ position:'absolute', left:120, top:460, width:600, fontFamily:HEL, fontSize:24, fontWeight:400, color:FG, lineHeight:1.4, opacity:clamp((progress-0.2)*3,0,1) }}>
        Открыт для сотрудничества и новых идей.<br/>Choose a channel:
      </div>
      {channels.map((c,i) => {
        const x = c.x - (i-1)*600*(1-eased);
        const r = 56*pulse;
        const labelOpacity = clamp((progress-0.35-i*0.04)*4,0,1);
        return (
          <React.Fragment key={i}>
            <Circle cx={x} cy={760} r={r} fill={FG} opacity={eased} />
            <svg width="1920" height="1080" style={{ position:'absolute', inset:0, pointerEvents:'none' }}>
              <circle cx={x} cy={760} r={r+24} fill="none" stroke={FG} strokeWidth="1" strokeDasharray="2 5" opacity={eased*0.4} />
            </svg>
            <div style={{ position:'absolute', left:x-200, top:844, width:400, textAlign:'center', opacity:labelOpacity, transform:`translateY(${(1-labelOpacity)*12}px)` }}>
              <div style={{ fontFamily:HEL, fontSize:26, fontWeight:700, color:FG, letterSpacing:'-0.01em' }}>{c.label}</div>
              <div style={{ fontFamily:MONO, fontSize:13, color:FG, letterSpacing:'0.04em', marginTop:6 }}>{c.handle}</div>
            </div>
          </React.Fragment>
        );
      })}
      <div style={{ position:'absolute', left:0, bottom:120, width:1920, textAlign:'center', fontFamily:MONO, fontSize:22, color:FG, letterSpacing:'0.2em', textTransform:'uppercase' }}>
        {finalWord.slice(0,showChars)}
        <span style={{ display:'inline-block', width:10, height:22, background:FG, marginLeft:4, verticalAlign:'middle', opacity:localTime%0.6<0.3?1:0 }} />
      </div>
    </>
  );
}

function Reel() {
  return (
    <>
      <Grain /><Reticle /><StarField count={50} />
      <Sprite start={0}  end={4}>  <SceneIntro    /></Sprite>
      <Sprite start={4}  end={9}>  <SceneName     /></Sprite>
      <Sprite start={9}  end={14}> <SceneAbout    /></Sprite>
      <Sprite start={14} end={20}> <SceneSkills   /></Sprite>
      <Sprite start={20} end={27}> <SceneProjects /></Sprite>
      <Sprite start={27} end={32}> <SceneContact  /></Sprite>
      <HUD />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Stage width={1920} height={1080} duration={32} background="#ededea" persistKey="llapik-reel">
    <Reel />
  </Stage>
);
</script>
</body>
